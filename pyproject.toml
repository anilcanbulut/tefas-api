[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tefas-api"
version = "0.1.0"
description = "Direct, rate-limit-safe client for the TEFAS (Turkish fund platform) JSON API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Anil Can Bulut" }]
keywords = ["tefas", "fund", "finance", "turkey", "yatirim", "fon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7", "responses>=0.23", "ruff>=0.4"]

[project.scripts]
tefas = "tefas.cli:main"

[project.urls]
Repository = "https://github.com/anilcanbulut/tefas-api"

[tool.hatch.build.targets.wheel]
packages = ["src/tefas"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
